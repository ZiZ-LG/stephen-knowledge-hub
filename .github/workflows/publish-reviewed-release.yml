name: Stephen publish immutable reviewed Release

on:
  workflow_run:
    workflows:
      - Stephen approve reviewed content
    types:
      - completed
  workflow_dispatch:
    inputs:
      approval_run_id:
        description: Original successful approval workflow run ID
        required: true
        type: string
      approval_run_attempt:
        description: Original successful approval workflow run attempt
        required: true
        type: string

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: stephen-reviewed-release-${{ github.event.workflow_run.id || inputs.approval_run_id }}-${{ github.event.workflow_run.run_attempt || inputs.approval_run_attempt }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (
        github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'workflow_dispatch'
        && github.event.workflow_run.status == 'completed'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Resolve and authenticate the exact source approval run
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.repository }}
          CURRENT_REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_CONTROL_SHA: ${{ github.sha }}
          AUTOMATIC_RUN_ID: ${{ github.event.workflow_run.id }}
          AUTOMATIC_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          AUTOMATIC_SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          AUTOMATIC_SOURCE_STATUS: ${{ github.event.workflow_run.status }}
          INPUT_RUN_ID: ${{ inputs.approval_run_id }}
          INPUT_RUN_ATTEMPT: ${{ inputs.approval_run_attempt }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$ACTOR" == "$REPOSITORY_OWNER" ]]
            [[ "$TRIGGERING_ACTOR" == "$REPOSITORY_OWNER" ]]
            [[ "$CURRENT_REF" == "$DEFAULT_BRANCH" ]]
            approval_run_id="$INPUT_RUN_ID"
            approval_run_attempt="$INPUT_RUN_ATTEMPT"
          else
            [[ "$EVENT_NAME" == "workflow_run" ]]
            [[ "$AUTOMATIC_SOURCE_EVENT" == "workflow_dispatch" ]]
            [[ "$AUTOMATIC_SOURCE_STATUS" == "completed" ]]
            approval_run_id="$AUTOMATIC_RUN_ID"
            approval_run_attempt="$AUTOMATIC_RUN_ATTEMPT"
          fi
          [[ "$approval_run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$approval_run_attempt" =~ ^[1-9][0-9]*$ ]]
          gh api --method GET \
            "repos/$GH_REPO/actions/runs/$approval_run_id/attempts/$approval_run_attempt" \
            > "$RUNNER_TEMP/saas-608-approval-run.json"
          jq -e \
            --argjson runId "$approval_run_id" \
            --argjson runAttempt "$approval_run_attempt" \
            --arg repository "$GH_REPO" \
            --arg owner "$REPOSITORY_OWNER" \
            --arg defaultBranch "$DEFAULT_BRANCH" \
            '.id == $runId
              and .run_attempt == $runAttempt
              and .repository.full_name == $repository
              and .event == "workflow_dispatch"
              and .status == "completed"
              and .conclusion == "success"
              and .path == ".github/workflows/approve-reviewed-content.yml"
              and .head_branch == $defaultBranch
              and .actor.login == $owner
              and .triggering_actor.login == $owner
              and (.head_sha | test("^[0-9a-f]{40}$"))' \
            "$RUNNER_TEMP/saas-608-approval-run.json" >/dev/null
          artifact_name="stephen-reviewed-release-handoff-$approval_run_id-$approval_run_attempt"
          {
            echo "run_id=$approval_run_id"
            echo "run_attempt=$approval_run_attempt"
            echo "approval_control_sha=$(jq -r .head_sha "$RUNNER_TEMP/saas-608-approval-run.json")"
            echo "artifact_name=$artifact_name"
            echo "release_control_sha=$RELEASE_CONTROL_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Read the exact approval artifact and trusted job facts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APPROVAL_RUN_ID: ${{ steps.source.outputs.run_id }}
          APPROVAL_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          ARTIFACT_NAME: ${{ steps.source.outputs.artifact_name }}
        run: |
          set -euo pipefail
          gh api --method GET \
            "repos/$GH_REPO/actions/runs/$APPROVAL_RUN_ID/artifacts?per_page=100" \
            > "$RUNNER_TEMP/saas-608-approval-artifacts.json"
          jq --arg name "$ARTIFACT_NAME" \
            '[.artifacts[] | select(.name == $name)]
            | if length == 1 then .[0]
              else error("missing or duplicate exact approval handoff artifact")
              end' "$RUNNER_TEMP/saas-608-approval-artifacts.json" \
            > "$RUNNER_TEMP/saas-608-approval-artifact.json"
          jq -e \
            --argjson runId "$APPROVAL_RUN_ID" \
            '.expired == false
              and (.id | type == "number" and . >= 1)
              and (.digest | test("^sha256:[0-9a-f]{64}$"))
              and .workflow_run.id == $runId' \
            "$RUNNER_TEMP/saas-608-approval-artifact.json" >/dev/null
          gh api --method GET \
            "repos/$GH_REPO/actions/runs/$APPROVAL_RUN_ID/attempts/$APPROVAL_RUN_ATTEMPT/jobs?per_page=100" \
            > "$RUNNER_TEMP/saas-608-approval-jobs.json"
          jq '[.jobs[] | select(.name == "approve")]
            | if length == 1 then .[0]
              else error("missing or duplicate trusted approval job")
              end' "$RUNNER_TEMP/saas-608-approval-jobs.json" \
            > "$RUNNER_TEMP/saas-608-approval-job.json"

      - name: Download the durable approval-run handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          path: handoff
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Validate the bounded workflow-run handoff
        id: handoff
        env:
          HANDOFF_PATH: handoff/release-handoff.json
          WORKFLOW_RUN_ID: ${{ steps.source.outputs.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          WORKFLOW_HEAD_SHA: ${{ steps.source.outputs.approval_control_sha }}
        run: |
          set -euo pipefail
          jq -e \
            --argjson runId "$WORKFLOW_RUN_ID" \
            --argjson runAttempt "$WORKFLOW_RUN_ATTEMPT" \
            --arg controlSha "$WORKFLOW_HEAD_SHA" \
            '.schemaVersion == 1
              and .task == "SAAS-608"
              and .approvalRunId == $runId
              and .approvalRunAttempt == $runAttempt
              and .controlSha == $controlSha
              and (.pr | type == "number" and . >= 1)
              and (.candidateSha | test("^[0-9a-f]{40}$"))
              and (.promotionSha | test("^[0-9a-f]{40}$"))
              and (.sealSha | test("^[0-9a-f]{40}$"))
              and (.approvalRecord | test("^editorial-releases/[0-9]{4}-[0-9]{2}-[0-9]{2}/[0-9a-f]{12}/approval\\.json$"))
              and (.releaseTag | test("^stephen-content-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]{12}$"))' \
            "$HANDOFF_PATH" >/dev/null
          {
            echo "pr=$(jq -r .pr "$HANDOFF_PATH")"
            echo "candidate_sha=$(jq -r .candidateSha "$HANDOFF_PATH")"
            echo "promotion_sha=$(jq -r .promotionSha "$HANDOFF_PATH")"
            echo "seal_sha=$(jq -r .sealSha "$HANDOFF_PATH")"
            echo "approval_record=$(jq -r .approvalRecord "$HANDOFF_PATH")"
            echo "release_tag=$(jq -r .releaseTag "$HANDOFF_PATH")"
            echo "approval_run_id=$(jq -r .approvalRunId "$HANDOFF_PATH")"
            echo "approval_run_attempt=$(jq -r .approvalRunAttempt "$HANDOFF_PATH")"
            echo "control_sha=$(jq -r .controlSha "$HANDOFF_PATH")"
          } >> "$GITHUB_OUTPUT"

      - name: Check out trusted Release controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.source.outputs.release_control_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false

      - name: Bind trusted Release controls to this workflow SHA
        working-directory: trusted
        env:
          RELEASE_CONTROL_SHA: ${{ steps.source.outputs.release_control_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_CONTROL_SHA" ]]

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Read merged PR and repository Release facts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.handoff.outputs.pr }}
          RELEASE_TAG: ${{ steps.handoff.outputs.release_tag }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          gh api --method GET "repos/$GH_REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/saas-608-release-pr.json"
          bash trusted/scripts/github-api-read-optional.sh \
            "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" \
            "$RUNNER_TEMP/saas-608-existing-tag.json"
          gh api --paginate --slurp --method GET "repos/$GH_REPO/releases?per_page=100" \
            > "$RUNNER_TEMP/saas-608-release-pages.json"
          jq --arg tag "$RELEASE_TAG" \
            '[.[][] | select(.tag_name == $tag)]
            | if length == 0 then null
              elif length == 1 then .[0]
              else error("duplicate Release tag identity")
              end' "$RUNNER_TEMP/saas-608-release-pages.json" \
            > "$RUNNER_TEMP/saas-608-existing-release.json"

      - name: Read fail-closed repository governance facts
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        env:
          GH_TOKEN: ${{ secrets.STEPHEN_RELEASE_GOVERNANCE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          BASH_ENV: /dev/null
          ENV: /dev/null
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]]
          gh api --method GET "repos/$GH_REPO/immutable-releases" \
            > "$RUNNER_TEMP/saas-608-immutability.json"
          gh api --paginate --slurp --method GET \
            "repos/$GH_REPO/collaborators?affiliation=all&per_page=100" \
            > "$RUNNER_TEMP/saas-608-collaborator-pages.json"
          jq '[.[][] | select(.permissions.push == true) | { login }]' \
            "$RUNNER_TEMP/saas-608-collaborator-pages.json" \
            > "$RUNNER_TEMP/saas-608-write-collaborators.json"
          gh api --paginate --slurp --method GET \
            "repos/$GH_REPO/rulesets?includes_parents=true&per_page=100" \
            > "$RUNNER_TEMP/saas-608-ruleset-pages.json"
          jq -r '[.[][] | select(.name == "Protect Stephen immutable Release tags") | .id]
            | if length == 1 then .[0] else error("missing or duplicate Stephen tag ruleset") end' \
            "$RUNNER_TEMP/saas-608-ruleset-pages.json" \
            > "$RUNNER_TEMP/saas-608-tag-ruleset-id.txt"
          tag_ruleset_id=$(cat "$RUNNER_TEMP/saas-608-tag-ruleset-id.txt")
          gh api --method GET "repos/$GH_REPO/rulesets/$tag_ruleset_id" \
            > "$RUNNER_TEMP/saas-608-tag-ruleset.json"

      - name: Check out the exact approval seal tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.handoff.outputs.seal_sha }}
          path: release
          fetch-depth: 3
          persist-credentials: false

      - name: Build and bind the exact seal artifact
        working-directory: release
        env:
          SEAL_SHA: ${{ steps.handoff.outputs.seal_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SEAL_SHA" ]]
          npm ci
          npm run check
          node --experimental-strip-types scripts/stephen-release-cli.ts verify \
            --artifact "$GITHUB_WORKSPACE/release/dist" \
            --source-sha "$SEAL_SHA" \
            --metadata-file "$GITHUB_WORKSPACE/release/dist/.stephen-release.json"
          jq -n --arg sealSha "$SEAL_SHA" \
            '{ sealSha: $sealSha, verified: true }' \
            > "$RUNNER_TEMP/saas-608-exact-seal-rebuild.json"

      - name: Create deterministic Release assets
        id: assets
        env:
          SEAL_SHA: ${{ steps.handoff.outputs.seal_sha }}
        run: |
          set -euo pipefail
          archive_name="stephen-site-${SEAL_SHA:0:12}.tar.gz"
          archive_path="$RUNNER_TEMP/$archive_name"
          metadata_path="$GITHUB_WORKSPACE/release/dist/.stephen-release.json"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -cf "$RUNNER_TEMP/stephen-site.tar" -C "$GITHUB_WORKSPACE/release/dist" .
          gzip -n -9 "$RUNNER_TEMP/stephen-site.tar"
          mv "$RUNNER_TEMP/stephen-site.tar.gz" "$archive_path"
          archive_sha=$(sha256sum "$archive_path" | awk '{print $1}')
          metadata_sha=$(sha256sum "$metadata_path" | awk '{print $1}')
          jq -n \
            --arg archiveName "$archive_name" \
            --arg archivePath "$archive_path" \
            --arg archiveSha "$archive_sha" \
            --arg metadataPath "$metadata_path" \
            --arg metadataSha "$metadata_sha" \
            '{
              assets: [
                { name: $archiveName, path: $archivePath, sha256: $archiveSha },
                { name: "default.stephen-release.json", path: $metadataPath, sha256: $metadataSha }
              ]
            }' > "$RUNNER_TEMP/saas-608-assets.json"
          {
            echo "archive_name=$archive_name"
            echo "archive_path=$archive_path"
            echo "metadata_path=$metadata_path"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the exact Release request before mutation
        id: policy
        env:
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.handoff.outputs.candidate_sha }}
          PROMOTION_SHA: ${{ steps.handoff.outputs.promotion_sha }}
          SEAL_SHA: ${{ steps.handoff.outputs.seal_sha }}
          APPROVAL_RECORD: ${{ steps.handoff.outputs.approval_record }}
        run: |
          set -euo pipefail
          merge_sha=$(jq -r .merge_commit_sha "$RUNNER_TEMP/saas-608-release-pr.json")
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]
          jq --arg mergeSha "$merge_sha" '. + { mergeSha: $mergeSha }' \
            handoff/release-handoff.json > "$RUNNER_TEMP/saas-608-event-payload.json"
          default_branch_head=$(gh api --method GET \
            "repos/$GH_REPO/commits/$DEFAULT_BRANCH" --jq .sha)
          git -C trusted fetch --no-tags origin "$default_branch_head"
          if git -C trusted merge-base --is-ancestor "$merge_sha" "$default_branch_head"; then
            merge_reachable=true
          else
            merge_reachable=false
          fi
          promotion_record="${APPROVAL_RECORD%/approval.json}/promotion.json"
          test -f "release/$APPROVAL_RECORD"
          test -f "release/$promotion_record"
          cd release
          promotion_parent=$(git rev-parse "$PROMOTION_SHA^")
          seal_parent=$(git rev-parse "$SEAL_SHA^")
          cd ..
          jq -n \
            --arg repository "$GH_REPO" \
            --arg defaultBranch "$DEFAULT_BRANCH" \
            --arg defaultBranchHead "$default_branch_head" \
            --argjson mergeReachable "$merge_reachable" \
            --arg promotionParent "$promotion_parent" \
            --arg sealParent "$seal_parent" \
            --slurpfile payload "$RUNNER_TEMP/saas-608-event-payload.json" \
            --slurpfile pr "$RUNNER_TEMP/saas-608-release-pr.json" \
            --slurpfile approvalRun "$RUNNER_TEMP/saas-608-approval-run.json" \
            --slurpfile approvalArtifact "$RUNNER_TEMP/saas-608-approval-artifact.json" \
            --slurpfile approvalJob "$RUNNER_TEMP/saas-608-approval-job.json" \
            --slurpfile exactSealRebuild "$RUNNER_TEMP/saas-608-exact-seal-rebuild.json" \
            --slurpfile writers "$RUNNER_TEMP/saas-608-write-collaborators.json" \
            --slurpfile tagRuleset "$RUNNER_TEMP/saas-608-tag-ruleset.json" \
            --slurpfile immutable "$RUNNER_TEMP/saas-608-immutability.json" \
            --slurpfile promotion "release/$promotion_record" \
            --slurpfile seal "release/$APPROVAL_RECORD" \
            --slurpfile assets "$RUNNER_TEMP/saas-608-assets.json" \
            --slurpfile tag "$RUNNER_TEMP/saas-608-existing-tag.json" \
            --slurpfile existing "$RUNNER_TEMP/saas-608-existing-release.json" \
            '{
              repository: $repository,
              defaultBranch: $defaultBranch,
              defaultBranchHeadSha: $defaultBranchHead,
              mergeReachableFromDefault: $mergeReachable,
              payload: $payload[0],
              pr: {
                number: $pr[0].number,
                merged: $pr[0].merged,
                mergeCommitSha: $pr[0].merge_commit_sha,
                headSha: $pr[0].head.sha,
                headRepository: $pr[0].head.repo.full_name,
                baseRepository: $pr[0].base.repo.full_name,
                baseRef: $pr[0].base.ref
              },
              approvalRun: {
                id: $approvalRun[0].id,
                runAttempt: $approvalRun[0].run_attempt,
                event: $approvalRun[0].event,
                status: $approvalRun[0].status,
                conclusion: $approvalRun[0].conclusion,
                headSha: $approvalRun[0].head_sha,
                path: $approvalRun[0].path,
                actor: $approvalRun[0].actor.login,
                triggeringActor: $approvalRun[0].triggering_actor.login
              },
              approvalArtifact: {
                id: $approvalArtifact[0].id,
                name: $approvalArtifact[0].name,
                expired: $approvalArtifact[0].expired,
                digest: $approvalArtifact[0].digest,
                workflowRunId: $approvalArtifact[0].workflow_run.id
              },
              approvalJob: {
                name: $approvalJob[0].name,
                status: $approvalJob[0].status,
                conclusion: $approvalJob[0].conclusion,
                steps: ($approvalJob[0].steps | map({ number, name, status, conclusion }))
              },
              exactSealRebuild: $exactSealRebuild[0],
              writeCollaborators: $writers[0],
              releaseTagRuleset: {
                name: $tagRuleset[0].name,
                target: $tagRuleset[0].target,
                enforcement: $tagRuleset[0].enforcement,
                bypassActorCount: ($tagRuleset[0].bypass_actors | length),
                includedRefs: $tagRuleset[0].conditions.ref_name.include,
                excludedRefs: $tagRuleset[0].conditions.ref_name.exclude,
                ruleTypes: ($tagRuleset[0].rules | map(.type))
              },
              immutableReleases: { enabled: $immutable[0].enabled },
              promotion: $promotion[0],
              seal: $seal[0],
              promotionParentSha: $promotionParent,
              sealParentSha: $sealParent,
              expectedAssets: ($assets[0].assets | map({ name, sha256 })),
              existingTag: (if $tag[0] == null then null else {
                objectType: $tag[0].object.type,
                sha: $tag[0].object.sha
              } end),
              existingRelease: (if $existing[0] == null then null else {
                id: $existing[0].id,
                tagName: $existing[0].tag_name,
                targetCommitish: $existing[0].target_commitish,
                draft: $existing[0].draft,
                immutable: $existing[0].immutable,
                assets: ($existing[0].assets | map({ id, name, digest }))
              } end)
            }' > "$RUNNER_TEMP/saas-608-release-request.json"
          node --experimental-strip-types trusted/scripts/stephen-reviewed-release-cli.ts \
            validate-release --request "$RUNNER_TEMP/saas-608-release-request.json" \
            > "$RUNNER_TEMP/saas-608-release-policy.json"
          {
            echo "status=$(jq -r .status "$RUNNER_TEMP/saas-608-release-policy.json")"
            echo "release_id=$(jq -r '.releaseId // ""' "$RUNNER_TEMP/saas-608-release-policy.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Create or reuse the matching Draft Release
        id: draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_STATUS: ${{ steps.policy.outputs.status }}
          EXISTING_RELEASE_ID: ${{ steps.policy.outputs.release_id }}
          RELEASE_TAG: ${{ steps.handoff.outputs.release_tag }}
          SEAL_SHA: ${{ steps.handoff.outputs.seal_sha }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_STATUS" == "create_draft" ]]; then
            gh api --method POST "repos/$GH_REPO/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$SEAL_SHA" \
              -f name="$RELEASE_TAG" \
              -f body="Owner-approved Stephen content bound to seal $SEAL_SHA." \
              -F draft=true \
              -F prerelease=false \
              -F generate_release_notes=false \
              > "$RUNNER_TEMP/saas-608-draft-release.json"
            release_id=$(jq -r .id "$RUNNER_TEMP/saas-608-draft-release.json")
          else
            release_id="$EXISTING_RELEASE_ID"
          fi
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Upload only missing matching assets
        if: steps.policy.outputs.status != 'already_immutable'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          set -euo pipefail
          jq -r '.missingAssets[]' "$RUNNER_TEMP/saas-608-release-policy.json" \
            | while IFS= read -r asset_name; do
              asset_path=$(jq -r --arg name "$asset_name" \
                '.assets[] | select(.name == $name) | .path' "$RUNNER_TEMP/saas-608-assets.json")
              test -f "$asset_path"
              curl --fail-with-body --silent --show-error \
                --request POST \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer $GITHUB_TOKEN" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --header "Content-Type: application/octet-stream" \
                --data-binary "@$asset_path" \
                "https://uploads.github.com/repos/$GH_REPO/releases/$RELEASE_ID/assets?name=$asset_name" \
                > "$RUNNER_TEMP/saas-608-upload.json"
            done

      - name: Refresh governance facts before immutable publication
        if: steps.policy.outputs.status != 'already_immutable'
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        env:
          GH_TOKEN: ${{ secrets.STEPHEN_RELEASE_GOVERNANCE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          BASH_ENV: /dev/null
          ENV: /dev/null
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]]
          gh api --method GET "repos/$GH_REPO/immutable-releases" \
            > "$RUNNER_TEMP/saas-608-prepublish-immutability.json"
          gh api --paginate --slurp --method GET \
            "repos/$GH_REPO/collaborators?affiliation=all&per_page=100" \
            > "$RUNNER_TEMP/saas-608-prepublish-collaborator-pages.json"
          jq '[.[][] | select(.permissions.push == true) | { login }]' \
            "$RUNNER_TEMP/saas-608-prepublish-collaborator-pages.json" \
            > "$RUNNER_TEMP/saas-608-prepublish-write-collaborators.json"
          gh api --paginate --slurp --method GET \
            "repos/$GH_REPO/rulesets?includes_parents=true&per_page=100" \
            > "$RUNNER_TEMP/saas-608-prepublish-ruleset-pages.json"
          jq -r '[.[][] | select(.name == "Protect Stephen immutable Release tags") | .id]
            | if length == 1 then .[0] else error("missing or duplicate Stephen tag ruleset") end' \
            "$RUNNER_TEMP/saas-608-prepublish-ruleset-pages.json" \
            > "$RUNNER_TEMP/saas-608-prepublish-tag-ruleset-id.txt"
          tag_ruleset_id=$(cat "$RUNNER_TEMP/saas-608-prepublish-tag-ruleset-id.txt")
          gh api --method GET "repos/$GH_REPO/rulesets/$tag_ruleset_id" \
            > "$RUNNER_TEMP/saas-608-prepublish-tag-ruleset.json"

      - name: Verify fresh policy immediately before immutable publication
        if: steps.policy.outputs.status != 'already_immutable'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          RELEASE_TAG: ${{ steps.handoff.outputs.release_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          bash trusted/scripts/github-api-read-optional.sh \
            "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" \
            "$RUNNER_TEMP/saas-608-prepublish-tag.json"
          if [[ "$(jq -r 'if . == null then "absent" else "present" end' \
            "$RUNNER_TEMP/saas-608-prepublish-tag.json")" != "absent" ]]; then
            echo "Release tag must not exist before GitHub atomically publishes the Draft" >&2
            exit 1
          fi
          gh api --method GET "repos/$GH_REPO/releases/$RELEASE_ID" \
            > "$RUNNER_TEMP/saas-608-prepublish-release.json"
          merge_sha=$(jq -r .merge_commit_sha "$RUNNER_TEMP/saas-608-release-pr.json")
          current_default_sha=$(gh api --method GET \
            "repos/$GH_REPO/commits/$DEFAULT_BRANCH" --jq .sha)
          git -C trusted fetch --no-tags origin "$current_default_sha"
          git -C trusted merge-base --is-ancestor "$merge_sha" "$current_default_sha"
          jq --arg currentDefaultSha "$current_default_sha" \
            --slurpfile writers "$RUNNER_TEMP/saas-608-prepublish-write-collaborators.json" \
            --slurpfile tagRuleset "$RUNNER_TEMP/saas-608-prepublish-tag-ruleset.json" \
            --slurpfile immutable "$RUNNER_TEMP/saas-608-prepublish-immutability.json" \
            --slurpfile existing "$RUNNER_TEMP/saas-608-prepublish-release.json" \
            '.defaultBranchHeadSha = $currentDefaultSha
            | .mergeReachableFromDefault = true
            | .writeCollaborators = $writers[0]
            | .releaseTagRuleset = {
              name: $tagRuleset[0].name,
              target: $tagRuleset[0].target,
              enforcement: $tagRuleset[0].enforcement,
              bypassActorCount: ($tagRuleset[0].bypass_actors | length),
              includedRefs: $tagRuleset[0].conditions.ref_name.include,
              excludedRefs: $tagRuleset[0].conditions.ref_name.exclude,
              ruleTypes: ($tagRuleset[0].rules | map(.type))
            }
            | .immutableReleases = { enabled: $immutable[0].enabled }
            | .existingTag = null
            | .existingRelease = {
              id: $existing[0].id,
              tagName: $existing[0].tag_name,
              targetCommitish: $existing[0].target_commitish,
              draft: $existing[0].draft,
              immutable: $existing[0].immutable,
              assets: ($existing[0].assets | map({ id, name, digest }))
            }' "$RUNNER_TEMP/saas-608-release-request.json" \
            > "$RUNNER_TEMP/saas-608-prepublish-request.json"
          node --experimental-strip-types trusted/scripts/stephen-reviewed-release-cli.ts \
            validate-release --request "$RUNNER_TEMP/saas-608-prepublish-request.json" \
            > "$RUNNER_TEMP/saas-608-prepublish-policy.json"
          jq -e --argjson releaseId "$RELEASE_ID" \
            '.status == "reuse_draft"
              and .releaseId == $releaseId
              and (.missingAssets | length) == 0' \
            "$RUNNER_TEMP/saas-608-prepublish-policy.json" >/dev/null

      - name: Publish the complete Release
        if: steps.policy.outputs.status != 'already_immutable'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" \
            -F draft=false \
            -f make_latest=false \
            > "$RUNNER_TEMP/saas-608-published-release.json"

      - name: Require final immutable API state and matching assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.handoff.outputs.release_tag }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            gh api --method GET "repos/$GH_REPO/releases/tags/$RELEASE_TAG" \
              > "$RUNNER_TEMP/saas-608-final-release.json"
            if jq -e '.draft == false and .immutable == true' \
              "$RUNNER_TEMP/saas-608-final-release.json" >/dev/null; then
              break
            fi
            if [[ "$attempt" == "5" ]]; then
              echo "Release did not reach immutable state" >&2
              exit 1
            fi
            sleep 2
          done
          gh api --method GET "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/saas-608-final-tag.json"
          jq --slurpfile tag "$RUNNER_TEMP/saas-608-final-tag.json" \
            --slurpfile existing "$RUNNER_TEMP/saas-608-final-release.json" \
            '.existingTag = {
              objectType: $tag[0].object.type,
              sha: $tag[0].object.sha
            }
            | .existingRelease = {
              id: $existing[0].id,
              tagName: $existing[0].tag_name,
              targetCommitish: $existing[0].target_commitish,
              draft: $existing[0].draft,
              immutable: $existing[0].immutable,
              assets: ($existing[0].assets | map({ id, name, digest }))
            }' "$RUNNER_TEMP/saas-608-release-request.json" \
            > "$RUNNER_TEMP/saas-608-final-request.json"
          node --experimental-strip-types trusted/scripts/stephen-reviewed-release-cli.ts \
            validate-release --request "$RUNNER_TEMP/saas-608-final-request.json" \
            > "$RUNNER_TEMP/saas-608-final-policy.json"
          jq -e '.status == "already_immutable" and (.missingAssets | length) == 0' \
            "$RUNNER_TEMP/saas-608-final-policy.json" >/dev/null

      - name: Summarize immutable Release completion
        env:
          RELEASE_TAG: ${{ steps.handoff.outputs.release_tag }}
          SEAL_SHA: ${{ steps.handoff.outputs.seal_sha }}
        run: |
          merge_sha=$(jq -r .merge_commit_sha "$RUNNER_TEMP/saas-608-release-pr.json")
          {
            echo "## Stephen immutable Release"
            echo ""
            echo "- Release tag: \`$RELEASE_TAG\`"
            echo "- exact approval seal: \`$SEAL_SHA\`"
            echo "- merge commit: \`$merge_sha\`"
            echo "- immutable API state: \`true\`"
            echo "- external publication action: absent"
          } >> "$GITHUB_STEP_SUMMARY"
