name: Stephen publish immutable reviewed Release

on:
  repository_dispatch:
    types:
      - stephen_release_approved

permissions:
  contents: write
  checks: read

concurrency:
  group: stephen-reviewed-release-publication
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out trusted default-branch controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Validate the bounded dispatch envelope
        env:
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.client_payload.pr }}
          CANDIDATE_SHA: ${{ github.event.client_payload.candidateSha }}
          PROMOTION_SHA: ${{ github.event.client_payload.promotionSha }}
          SEAL_SHA: ${{ github.event.client_payload.sealSha }}
          MERGE_SHA: ${{ github.event.client_payload.mergeSha }}
          APPROVAL_RECORD: ${{ github.event.client_payload.approvalRecord }}
          RELEASE_TAG: ${{ github.event.client_payload.releaseTag }}
        run: |
          set -euo pipefail
          [[ "$EVENT_ACTION" == "stephen_release_approved" ]]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PROMOTION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SEAL_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APPROVAL_RECORD" =~ ^editorial-releases/[0-9]{4}-[0-9]{2}-[0-9]{2}/[0-9a-f]{12}/approval\.json$ ]]
          [[ "$RELEASE_TAG" =~ ^stephen-content-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]{12}$ ]]

      - name: Read merged PR, exact check and repository Release facts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.client_payload.pr }}
          SEAL_SHA: ${{ github.event.client_payload.sealSha }}
          RELEASE_TAG: ${{ github.event.client_payload.releaseTag }}
        run: |
          set -euo pipefail
          gh api --method GET "repos/$GH_REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/saas-608-release-pr.json"
          gh api --method GET "repos/$GH_REPO/commits/$SEAL_SHA/check-runs" \
            > "$RUNNER_TEMP/saas-608-check-runs.json"
          gh api --method GET "repos/$GH_REPO/immutable-releases" \
            > "$RUNNER_TEMP/saas-608-immutability.json"
          if gh api --method GET "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/saas-608-existing-tag.json" 2>/dev/null; then
            :
          else
            printf 'null\n' > "$RUNNER_TEMP/saas-608-existing-tag.json"
          fi
          gh api --paginate --slurp --method GET "repos/$GH_REPO/releases?per_page=100" \
            > "$RUNNER_TEMP/saas-608-release-pages.json"
          jq --arg tag "$RELEASE_TAG" \
            '[.[][] | select(.tag_name == $tag)]
            | if length == 0 then null
              elif length == 1 then .[0]
              else error("duplicate Release tag identity")
              end' "$RUNNER_TEMP/saas-608-release-pages.json" \
            > "$RUNNER_TEMP/saas-608-existing-release.json"

      - name: Check out the exact approval seal tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.client_payload.sealSha }}
          path: release
          fetch-depth: 3
          persist-credentials: false

      - name: Build and bind the exact seal artifact
        working-directory: release
        env:
          SEAL_SHA: ${{ github.event.client_payload.sealSha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SEAL_SHA" ]]
          npm ci
          npm run check
          node --experimental-strip-types scripts/stephen-release-cli.ts verify \
            --artifact "$GITHUB_WORKSPACE/release/dist" \
            --source-sha "$SEAL_SHA" \
            --metadata-file "$GITHUB_WORKSPACE/release/dist/.stephen-release.json"

      - name: Create deterministic Release assets
        id: assets
        env:
          SEAL_SHA: ${{ github.event.client_payload.sealSha }}
        run: |
          set -euo pipefail
          archive_name="stephen-site-${SEAL_SHA:0:12}.tar.gz"
          archive_path="$RUNNER_TEMP/$archive_name"
          metadata_path="$GITHUB_WORKSPACE/release/dist/.stephen-release.json"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -cf "$RUNNER_TEMP/stephen-site.tar" -C "$GITHUB_WORKSPACE/release/dist" .
          gzip -n -9 "$RUNNER_TEMP/stephen-site.tar"
          mv "$RUNNER_TEMP/stephen-site.tar.gz" "$archive_path"
          archive_sha=$(sha256sum "$archive_path" | awk '{print $1}')
          metadata_sha=$(sha256sum "$metadata_path" | awk '{print $1}')
          jq -n \
            --arg archiveName "$archive_name" \
            --arg archivePath "$archive_path" \
            --arg archiveSha "$archive_sha" \
            --arg metadataPath "$metadata_path" \
            --arg metadataSha "$metadata_sha" \
            '{
              assets: [
                { name: $archiveName, path: $archivePath, sha256: $archiveSha },
                { name: ".stephen-release.json", path: $metadataPath, sha256: $metadataSha }
              ]
            }' > "$RUNNER_TEMP/saas-608-assets.json"
          {
            echo "archive_name=$archive_name"
            echo "archive_path=$archive_path"
            echo "metadata_path=$metadata_path"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the exact Release request before mutation
        id: policy
        env:
          GH_REPO: ${{ github.repository }}
          EVENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          CANDIDATE_SHA: ${{ github.event.client_payload.candidateSha }}
          PROMOTION_SHA: ${{ github.event.client_payload.promotionSha }}
          SEAL_SHA: ${{ github.event.client_payload.sealSha }}
          APPROVAL_RECORD: ${{ github.event.client_payload.approvalRecord }}
        run: |
          set -euo pipefail
          printf '%s\n' "$EVENT_PAYLOAD" > "$RUNNER_TEMP/saas-608-event-payload.json"
          promotion_record="${APPROVAL_RECORD%/approval.json}/promotion.json"
          test -f "release/$APPROVAL_RECORD"
          test -f "release/$promotion_record"
          cd release
          promotion_parent=$(git rev-parse "$PROMOTION_SHA^")
          seal_parent=$(git rev-parse "$SEAL_SHA^")
          cd ..
          jq -n \
            --arg repository "$GH_REPO" \
            --arg promotionParent "$promotion_parent" \
            --arg sealParent "$seal_parent" \
            --slurpfile payload "$RUNNER_TEMP/saas-608-event-payload.json" \
            --slurpfile pr "$RUNNER_TEMP/saas-608-release-pr.json" \
            --slurpfile checks "$RUNNER_TEMP/saas-608-check-runs.json" \
            --slurpfile immutable "$RUNNER_TEMP/saas-608-immutability.json" \
            --slurpfile promotion "release/$promotion_record" \
            --slurpfile seal "release/$APPROVAL_RECORD" \
            --slurpfile assets "$RUNNER_TEMP/saas-608-assets.json" \
            --slurpfile tag "$RUNNER_TEMP/saas-608-existing-tag.json" \
            --slurpfile existing "$RUNNER_TEMP/saas-608-existing-release.json" \
            '{
              repository: $repository,
              payload: $payload[0],
              pr: {
                number: $pr[0].number,
                merged: $pr[0].merged,
                mergeCommitSha: $pr[0].merge_commit_sha,
                headSha: $pr[0].head.sha,
                headRepository: $pr[0].head.repo.full_name,
                baseRepository: $pr[0].base.repo.full_name
              },
              checkRuns: ($checks[0].check_runs | map({
                name,
                headSha: .head_sha,
                status,
                conclusion
              })),
              immutableReleases: { enabled: $immutable[0].enabled },
              promotion: $promotion[0],
              seal: $seal[0],
              promotionParentSha: $promotionParent,
              sealParentSha: $sealParent,
              expectedAssets: ($assets[0].assets | map({ name, sha256 })),
              existingTag: (if $tag[0] == null then null else {
                objectType: $tag[0].object.type,
                sha: $tag[0].object.sha
              } end),
              existingRelease: (if $existing[0] == null then null else {
                id: $existing[0].id,
                tagName: $existing[0].tag_name,
                targetCommitish: $existing[0].target_commitish,
                draft: $existing[0].draft,
                immutable: $existing[0].immutable,
                assets: ($existing[0].assets | map({ id, name, digest }))
              } end)
            }' > "$RUNNER_TEMP/saas-608-release-request.json"
          node --experimental-strip-types trusted/scripts/stephen-reviewed-release-cli.ts \
            validate-release --request "$RUNNER_TEMP/saas-608-release-request.json" \
            > "$RUNNER_TEMP/saas-608-release-policy.json"
          {
            echo "status=$(jq -r .status "$RUNNER_TEMP/saas-608-release-policy.json")"
            echo "release_id=$(jq -r '.releaseId // ""' "$RUNNER_TEMP/saas-608-release-policy.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Create or reuse the matching Draft Release
        id: draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_STATUS: ${{ steps.policy.outputs.status }}
          EXISTING_RELEASE_ID: ${{ steps.policy.outputs.release_id }}
          RELEASE_TAG: ${{ github.event.client_payload.releaseTag }}
          SEAL_SHA: ${{ github.event.client_payload.sealSha }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_STATUS" == "create_draft" ]]; then
            gh api --method POST "repos/$GH_REPO/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$SEAL_SHA" \
              -f name="$RELEASE_TAG" \
              -f body="Owner-approved Stephen content bound to seal $SEAL_SHA." \
              -F draft=true \
              -F prerelease=false \
              -F generate_release_notes=false \
              > "$RUNNER_TEMP/saas-608-draft-release.json"
            release_id=$(jq -r .id "$RUNNER_TEMP/saas-608-draft-release.json")
          else
            release_id="$EXISTING_RELEASE_ID"
          fi
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Upload only missing matching assets
        if: steps.policy.outputs.status != 'already_immutable'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          set -euo pipefail
          jq -r '.missingAssets[]' "$RUNNER_TEMP/saas-608-release-policy.json" \
            | while IFS= read -r asset_name; do
              asset_path=$(jq -r --arg name "$asset_name" \
                '.assets[] | select(.name == $name) | .path' "$RUNNER_TEMP/saas-608-assets.json")
              test -f "$asset_path"
              curl --fail-with-body --silent --show-error \
                --request POST \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer $GITHUB_TOKEN" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --header "Content-Type: application/octet-stream" \
                --data-binary "@$asset_path" \
                "https://uploads.github.com/repos/$GH_REPO/releases/$RELEASE_ID/assets?name=$asset_name" \
                > "$RUNNER_TEMP/saas-608-upload.json"
            done

      - name: Publish the complete Release
        if: steps.policy.outputs.status != 'already_immutable'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" \
            -F draft=false \
            -f make_latest=false \
            > "$RUNNER_TEMP/saas-608-published-release.json"

      - name: Require final immutable API state and matching assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.client_payload.releaseTag }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            gh api --method GET "repos/$GH_REPO/releases/tags/$RELEASE_TAG" \
              > "$RUNNER_TEMP/saas-608-final-release.json"
            if jq -e '.draft == false and .immutable == true' \
              "$RUNNER_TEMP/saas-608-final-release.json" >/dev/null; then
              break
            fi
            if [[ "$attempt" == "5" ]]; then
              echo "Release did not reach immutable state" >&2
              exit 1
            fi
            sleep 2
          done
          gh api --method GET "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/saas-608-final-tag.json"
          jq --slurpfile tag "$RUNNER_TEMP/saas-608-final-tag.json" \
            --slurpfile existing "$RUNNER_TEMP/saas-608-final-release.json" \
            '.existingTag = {
              objectType: $tag[0].object.type,
              sha: $tag[0].object.sha
            }
            | .existingRelease = {
              id: $existing[0].id,
              tagName: $existing[0].tag_name,
              targetCommitish: $existing[0].target_commitish,
              draft: $existing[0].draft,
              immutable: $existing[0].immutable,
              assets: ($existing[0].assets | map({ id, name, digest }))
            }' "$RUNNER_TEMP/saas-608-release-request.json" \
            > "$RUNNER_TEMP/saas-608-final-request.json"
          node --experimental-strip-types trusted/scripts/stephen-reviewed-release-cli.ts \
            validate-release --request "$RUNNER_TEMP/saas-608-final-request.json" \
            > "$RUNNER_TEMP/saas-608-final-policy.json"
          jq -e '.status == "already_immutable" and (.missingAssets | length) == 0' \
            "$RUNNER_TEMP/saas-608-final-policy.json" >/dev/null

      - name: Summarize immutable Release completion
        env:
          RELEASE_TAG: ${{ github.event.client_payload.releaseTag }}
          SEAL_SHA: ${{ github.event.client_payload.sealSha }}
          MERGE_SHA: ${{ github.event.client_payload.mergeSha }}
        run: |
          {
            echo "## Stephen immutable Release"
            echo ""
            echo "- Release tag: \`$RELEASE_TAG\`"
            echo "- exact approval seal: \`$SEAL_SHA\`"
            echo "- merge commit: \`$MERGE_SHA\`"
            echo "- immutable API state: \`true\`"
            echo "- external publication action: absent"
          } >> "$GITHUB_STEP_SUMMARY"
